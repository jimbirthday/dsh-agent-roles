# Additive Agent Roles layer over dsh-base. The catalog declares the planner,
# executor, and verifier roles that inherit the deployment's model route, and
# the tool exposes them to the model.
# Existing subagent tools stay enabled; this layer adds role-based delegation.
# The three plugins are self-contained inside this bundle package, so the
# bundle installs from one Git address without publishing them separately.

- insert:
    - id: agent-roles
      name: './plugins/agent-role/lib/index.js'
      config:
        backingProvider: spawn
        roles:
          planner:
            label: Planner
            description: >-
              Turns a complex task into atomic, independently executable steps with explicit inputs,
              actions, outputs, acceptance criteria, dependencies, and failure handling.
            tags: [planning, decomposition, read-only]
            contextDefault: fresh
          executor:
            label: Executor
            description: >-
              Executes specified steps with files, commands, and tools, then reports the original
              error and failing location instead of replanning or changing the requested output.
            tags: [execution, delivery, steps]
            contextDefault: fresh
          verifier:
            label: Verifier
            description: >-
              Checks a deliverable against stated acceptance criteria and reports pass, fail, or
              unverifiable with traceable evidence, without modifying the result.
            tags: [verification, acceptance, read-only]
            contextDefault: fresh

    - id: ui-agent-role-config
      name: './plugins/client-ui-agent-role-config/lib/index.js'

    - id: tool-agent-role
      name: './plugins/tool-agent-role/lib/index.js'
      config:
        toolName: role_agent
